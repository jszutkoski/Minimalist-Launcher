name: Build APK

on:
  push:
    branches: [main]
    # A version tag (v1.0, v1.1…) also publishes a permanent release of that version.
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish this build of main as a version release (for example 1.3, no v); empty for none"
        required: false
        default: ""

# Read-only unless a job asks for more: only publishing writes, and it never sees the key.
permissions:
  contents: read

# One build per branch or tag at a time, so two publishes never race on the same release. A
# version release has a group of its own: GitHub keeps one waiting run per group, and a push
# arriving meanwhile would otherwise cancel it.
concurrency:
  group: build-${{ github.ref }}-${{ inputs.version || 'push' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The signing key and its password (repository secrets, never in the code) are given only
    # to the two steps that need them, never to the job: the checkout, the caches and the
    # tests, with every plugin and library they load, never see them.
    env:
      # Published: a push to main or a version tag, or a manual version release of main.
      PUBLISHING: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.version != '') }}
      # The version the APK calls itself: the release's, or empty for "base version (run)".
      MINIMALIST_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      # Actions pinned to a commit, not a movable tag: a tag can be pointed at other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not left in .git/config for the build to find.
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # The screen tests run Android 15's framework, which needs Java 21; the app itself
          # is still built for Java 17.
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The open-source cache. The default since v6 is a closed-source library, and this
          # job holds the signing key.
          cache-provider: basic

      - name: Check a manual version release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Version releases are made from main only."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::\"$VERSION\" is not a version number such as 1.3 (no v)."
            exit 1
          fi

      # Unit tests and lint first, without the key: a failure stops everything before signing.
      - name: Test and lint
        run: ./gradlew testReleaseUnitTest lintRelease --stacktrace

      # Never for pull requests: unmerged code is not signed with the release key.
      - name: Decode the signing key
        if: github.event_name != 'pull_request'
        env:
          MINIMALIST_KEYSTORE: ${{ secrets.MINIMALIST_KEYSTORE }}
        run: |
          if [ -z "$MINIMALIST_KEYSTORE" ]; then
            if [ "$PUBLISHING" = "true" ]; then
              echo "::error::The MINIMALIST_KEYSTORE secret is missing; refusing to publish an unsigned APK."
              exit 1
            fi
            exit 0
          fi
          echo "$MINIMALIST_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "MINIMALIST_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          MINIMALIST_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MINIMALIST_KEYSTORE_PASSWORD || '' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Show the lint findings
        run: cat app/build/reports/lint-results-release.txt

      - name: Name the APK and its checksum
        # "-unsigned" in the name when built without the key (pull requests).
        run: |
          cp app/build/outputs/apk/release/app-release*.apk minimalist-launcher.apk
          sha256sum minimalist-launcher.apk > minimalist-launcher.apk.sha256

      - name: Clean up the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minimalist-launcher
          path: |
            minimalist-launcher.apk
            minimalist-launcher.apk.sha256

      - name: Show the lint report and failed tests
        if: failure()
        run: |
          cat app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt || true
          for f in app/build/test-results/testReleaseUnitTest/*.xml; do
            grep -q "<failure" "$f" && sed -n '/<failure/,/<\/failure>/p' "$f" | head -40
          done || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

  publish:
    needs: build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: minimalist-launcher

      # A single "latest" pre-release that always holds the newest APK, so it can be
      # downloaded straight from the phone without unzipping anything. Updated in place:
      # the old APK stays downloadable until the new one replaces it.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        run: |
          notes="Built from ${GITHUB_SHA::7}. SHA-256: $(cut -d' ' -f1 minimalist-launcher.apk.sha256)"
          if gh release view latest > /dev/null 2>&1 &&
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null; then
            gh release upload latest minimalist-launcher.apk minimalist-launcher.apk.sha256 --clobber
            gh release edit latest --notes "$notes"
          else
            gh release delete latest --cleanup-tag --yes || true
            gh release create latest minimalist-launcher.apk minimalist-launcher.apk.sha256 \
              --prerelease \
              --title "Latest build" \
              --notes "$notes" \
              --target "$GITHUB_SHA"
          fi

      # A permanent release for each version, kept alongside the moving "latest": from a
      # pushed tag (v1.0), or from a manual run given a version number, which creates the tag.
      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          cp minimalist-launcher.apk "minimalist-launcher-$TAG.apk"
          sha256sum "minimalist-launcher-$TAG.apk" > "minimalist-launcher-$TAG.apk.sha256"
          gh release create "$TAG" "minimalist-launcher-$TAG.apk" "minimalist-launcher-$TAG.apk.sha256" \
            --title "Minimalist $TAG" \
            --notes "Version ${TAG#v}, built from ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"

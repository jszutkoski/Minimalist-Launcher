name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk minimalist-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: minimalist-launcher
          path: minimalist-launcher.apk

      # A single "latest" pre-release that always holds the newest APK, so it can
      # be downloaded straight from the phone without unzipping anything.
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest minimalist-launcher.apk \
            --prerelease \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
